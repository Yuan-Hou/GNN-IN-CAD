[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-in-cad"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["load_mfcad", "mfcad_dataset", "models", "train_baselines", "audit_mfcad"]

[project.scripts]
train-baselines = "train_baselines:main"
