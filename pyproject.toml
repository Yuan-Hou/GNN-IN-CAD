[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-in-cad"
version = "0.2.0"
description = "UV-Net style face classification on MFCAD B-rep graphs"
requires-python = ">=3.11"

[project.scripts]
uvnet-train = "uvnet.cli:main"
uvnet-audit = "uvnet.audit:main"
uvnet-overfit = "uvnet.overfit:main"
train-baselines = "uvnet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
