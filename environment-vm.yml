# Linux x86_64 NVIDIA VM; mirrors the course's PyTorch/DGL versions.
name: gnn_project
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip=24.2
  - setuptools>=68
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://data.dgl.ai/wheels/repo.html
      - numpy==1.24.3
      - pandas==2.0.3
      - scipy==1.10.1
      - matplotlib==3.7.1
      - seaborn==0.13.0
      - networkx==3.1
      - scikit-learn==1.3.2
      - plotly==5.22.0
      - umap-learn==0.5.6
      - torch==2.1.2+cu121
      - dgl==1.0.2
      - pytorch-lightning==2.1.4
      - torchmetrics==1.3.2
      - tqdm==4.66.5
      - jupyterlab==4.2.5
      - ipykernel==6.29.5
